name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.58.2 refuses
    # ("Playwright does not support chromium on ubuntu26.04-x64"), breaking
    # the prerender step on every push. Unpin once Playwright is upgraded.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for search-ready HTML
        run: npx playwright install --with-deps chromium

      - name: Build
        env:
          VITE_SITE_URL: https://justintella.github.io/New-BACP-Website
          VITE_NOINDEX: "true"
        run: npm run build -- --base=/New-BACP-Website/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
